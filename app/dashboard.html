/*dashboard.html */
/* UI for frontend for SD² Dashboard */

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD² Run Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
        }
        #file-manager {
            width: 20%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #333;
        }
        #content-area {
            width: 80%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        #dashboard-header {
            margin-bottom: 20px;
        }
        #bokeh-container {
            flex-grow: 1;
            position: relative;
        }
        #bokeh-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1e1e1e;
            display: none;
        }
        #fallback-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            background-color: #1e1e1e;
        }
        .folder, .file {
            position: relative;
            padding-left: 20px;
            padding: 5px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-name {
            flex-grow: 1;
        }
        .file-actions {
            display: none;
            margin-left: 10px;
        }
        .selected .file-actions {
            display: flex;
        }
        .folder:hover, .file:hover {
            background-color: #333;
        }
        .folder::before, .file::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            width: 10px;
            height: 1px;
            background-color: #e0e0e0;
        }
        .folder::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #e0e0e0;
        }
        .folder:last-child::after {
            height: 10px;
        }
        .file::before {
            left: 10px;
        }
        .selected {
            background-color: #3a75d5;
        }
        .file.selected {
            background-color: #3a75d5;
        }
        #upload-button {
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        #upload-button:hover {
            background-color: #555;
        }
        .action-icon {
            margin-left: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        .action-icon svg {
            width: 100%;
            height: 100%;
            fill: #e0e0e0;
        }
        .action-icon:hover svg {
            fill: #ffffff;
        }
        .action-icon.active svg {
            fill: #3a75d5;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="file-manager">
        <h2>Select Runs</h2>
        <button id="upload-button">Upload Root Directory</button>
        <div id="file-tree"></div>
    </div>
    <div id="content-area">
        <div id="dashboard-header">
            <h2>SD² Run Dashboard</h2>
        </div>
        <div id="bokeh-container">
            <iframe id="bokeh-iframe" src="about:blank"></iframe>
            <div id="fallback-message">Runs will appear here when selected</div>
        </div>
    </div>

<script>
    let bokehServerActive = false;
    let lastCheckTime = 0;
    const CHECK_INTERVAL = 5000;
    const selectedFiles = new Map();

    async function checkBokehServer() {
        const now = Date.now();
        if (now - lastCheckTime < CHECK_INTERVAL) return;
        lastCheckTime = now;

        const iframe = document.getElementById('bokeh-iframe');
        const fallback = document.getElementById('fallback-message');
        const bokehUrl = 'http://localhost:5006/single_run';

        try {
            const response = await fetch(bokehUrl, {
                method: 'HEAD',
                mode: 'no-cors',
                cache: 'no-store'
            });

            if (!bokehServerActive) {
                bokehServerActive = true;
                if (iframe.src !== bokehUrl) {
                    iframe.src = bokehUrl;
                }
                iframe.style.display = 'block';
                fallback.style.display = 'none';
            }
        } catch (error) {
            if (bokehServerActive) {
                bokehServerActive = false;
                iframe.style.display = 'none';
                fallback.style.display = 'flex';
            }
        }
    }

    function logSelectedFiles() {
        console.log("Currently selected files:");
        selectedFiles.forEach((state, fileName) => {
            console.log(`File: ${fileName}, Visible: ${state.visible}, Comments: ${state.comments}`);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkBokehServer();
        setInterval(checkBokehServer, CHECK_INTERVAL);
    });

    document.getElementById("upload-button").addEventListener("click", async () => {
        try {
            const directoryHandle = await window.showDirectoryPicker();
            document.getElementById("file-tree").innerHTML = "";
            await buildFileTree(directoryHandle, document.getElementById("file-tree"), "");
        } catch (error) {
            console.error("Error accessing directory:", error);
        }
    });

    async function buildFileTree(directoryHandle, container, prefix) {
        const entries = [];
        for await (const entry of directoryHandle.values()) {
            if (entry.kind === "directory" || (entry.kind === "file" && entry.name.toLowerCase().endsWith('.txt'))) {
                entries.push(entry);
            }
        }

        entries.sort((a, b) => a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name));

        entries.forEach((entry, index) => {
            const isLast = index === entries.length - 1;
            const newPrefix = prefix + (isLast ? "    " : "│   ");

            if (entry.kind === "directory") {
                const folderDiv = document.createElement("div");
                folderDiv.classList.add("folder");
                folderDiv.innerHTML = `<span>${prefix ? "│   " : ""}${isLast ? "└── " : "├── "}${entry.name}</span>`;
                container.appendChild(folderDiv);

                const subContainer = document.createElement("div");
                subContainer.style.display = "none";
                container.appendChild(subContainer);

                folderDiv.addEventListener("click", (event) => {
                    event.stopPropagation();
                    subContainer.style.display = subContainer.style.display === "none" ? "block" : "none";
                });

                buildFileTree(entry, subContainer, newPrefix);
            } else if (entry.kind === "file") {
                const fileDiv = document.createElement("div");
                fileDiv.classList.add("file");

                const fileNameSpan = document.createElement("span");
                fileNameSpan.classList.add("file-name");
                fileNameSpan.textContent = `${prefix}${isLast ? "└── " : "├── "}${entry.name}`;

                const actionsDiv = document.createElement("div");
                actionsDiv.classList.add("file-actions");

                const visibilityContainer = document.createElement("div");
                visibilityContainer.classList.add("action-icon");
                visibilityContainer.title = "Toggle Visibility";
                visibilityContainer.innerHTML = `
                    <svg class="view-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="#333">
                        <image href="svg-icons/view-open.svg" width="24" height="24"/>
                    </svg>
                    <svg class="view-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="#333">
                        <image href="svg-icons/view-closed.svg" width="24" height="24"/>
                    </svg>
                `;

                const commentsContainer = document.createElement("div");
                commentsContainer.classList.add("action-icon");
                commentsContainer.title = "Toggle Comments";
                commentsContainer.innerHTML = `
                    <svg class="comment-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <image href="svg-icons/comment-closed.svg" width="24" height="24"/>
                    </svg>
                    <svg class="comment-opened hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 13.4876 3.36093 14.891 4 16.1272L3 21L7.8728 20C9.10904 20.6391 10.5124 21 12 21Z" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                `;

                const fileState = {
                    visible: true,
                    comments: false,
                    element: fileDiv
                };

                visibilityContainer.addEventListener("click", (e) => {
                    if (!fileDiv.classList.contains("selected")) return;
                    e.stopPropagation();
                    const viewOpen = visibilityContainer.querySelector('.view-open');
                    const viewClosed = visibilityContainer.querySelector('.view-closed');
                    viewOpen.classList.toggle('hidden');
                    viewClosed.classList.toggle('hidden');
                    visibilityContainer.classList.toggle('active');
                    fileState.visible = !fileState.visible;
                    logSelectedFiles();
                });

                commentsContainer.addEventListener("click", (e) => {
                    if (!fileDiv.classList.contains("selected")) return;
                    e.stopPropagation();
                    const commentClosed = commentsContainer.querySelector('.comment-closed');
                    const commentOpened = commentsContainer.querySelector('.comment-opened');
                    commentClosed.classList.toggle('hidden');
                    commentOpened.classList.toggle('hidden');
                    commentsContainer.classList.toggle('active');
                    fileState.comments = !fileState.comments;
                    logSelectedFiles();
                });

                actionsDiv.appendChild(visibilityContainer);
                actionsDiv.appendChild(commentsContainer);

                fileDiv.appendChild(fileNameSpan);
                fileDiv.appendChild(actionsDiv);

                fileDiv.addEventListener("click", (event) => {
                    if (event.target === fileDiv || event.target === fileNameSpan) {
                        fileDiv.classList.toggle("selected");
                        if (fileDiv.classList.contains("selected")) {
                            selectedFiles.set(entry.name, fileState);
                        } else {
                            selectedFiles.delete(entry.name);
                        }
                        logSelectedFiles();
                    }
                });

                container.appendChild(fileDiv);
            }
        });
    }
</script>
</body>
</html>a
